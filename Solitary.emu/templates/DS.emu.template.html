<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DS.emu</title>
  <style>
    /* __CSS__ */
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="topbar">
      <h1>DS.emu</h1>
      <p id="statusText">Initializing</p>
    </div>

    <div class="stage">
      <canvas id="screenCanvas" width="256" height="384"></canvas>
    </div>
  </main>

  <script>
    /* __CORE__ */
  </script>

  <script>
    const WASM_BASE64_DATA = "__WASM_BASE64__";
    const ROM_BASE64_DATA = "__ROM_BASE64__";

    function decodeBase64(value) {
      const clean = value.replace(/\s/g, "");
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    globalThis.embeddedWasmBinary = decodeBase64(WASM_BASE64_DATA);
    globalThis.embeddedRomBytes = decodeBase64(ROM_BASE64_DATA);

    globalThis.embeddedAudioWorkletSource = `
      class PilasAudioWorklet extends AudioWorkletProcessor {
        constructor() {
          super();
          this.queue = [];
          this.current = null;
          this.offset = 0;

          this.port.onmessage = (event) => {
            if (event.data?.type === "samples" && event.data.samples) {
              this.queue.push(event.data.samples);
              while (this.queue.length > 8) this.queue.shift();
            }
          };
        }

        nextSample(channel) {
          if (!this.current || this.offset >= this.current.length) {
            this.current = this.queue.shift() || null;
            this.offset = 0;
          }
          if (!this.current) return 0;
          return this.current[this.offset + channel] || 0;
        }

        process(_, outputs) {
          const output = outputs[0];
          const left = output[0];
          const right = output[1] || output[0];

          for (let i = 0; i < left.length; i++) {
            left[i] = this.nextSample(0);
            right[i] = this.nextSample(1);
            this.offset += 2;
          }

          return true;
        }
      }

      registerProcessor("pilas-audio-worklet", PilasAudioWorklet);
    `;

    globalThis.embeddedAudioWorkletUrl = URL.createObjectURL(
      new Blob([globalThis.embeddedAudioWorkletSource], { type: "application/javascript" })
    );
  </script>

  <script>
    /* __APP__ */
  </script>
</body>
</html>
